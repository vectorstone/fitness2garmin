[project]
name = "fitness2garmin"
version = "0.1.0"
description = "Apple Health (Apple Watch) → Garmin Connect migration pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.3.20",
    "garmin-fit-sdk>=21.221.0",
    "openpyxl>=3.1",
]

[project.scripts]
f2g = "fitness2garmin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitness2garmin"]
